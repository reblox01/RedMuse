# Machine-readable source registry for the RedMuse update check.
#
# This file is the single source of truth for tools/check_updates.py.
# To find where a skill comes from, look up its name in the covers
# list of an entry. Adding a source here is enough to have it
# checked; no script edit is needed.
#
# Fields per source:
#   name: short id used in check output.
#   covers: skill names or layers this source is the origin of.
#   repo: git URL, when the source is a git repo. Omitted for manual
#     sources, which have no version endpoint.
#   kind: self (this repo), reference (tracked, never vendored),
#     manual (no version endpoint, reviewed by hand).
#   check: git-head (compare upstream HEAD) or manual.
#   auto_update: fast-forward-pull (RedMuse itself only) or none.
#     none means a delta becomes a follow-up task, never a rewrite.
#   cli: command-line tools the skills use, or none. Recorded so the
#     run machine can check availability; never auto-installed.
sources:
  - name: redmuse
    covers:
      - redmuse-orchestrator
      - redmuse-recon
      - redmuse-cve-intel
      - redmuse-web
      - redmuse-api
      - redmuse-auth
      - redmuse-code
      - redmuse-report
      - redmuse-fix
      - redmuse-verify
      - redmuse-ci
      - redmuse-dev-audit
      - redmuse-update
      - redmuse-mcp
    repo: https://github.com/reblox01/RedMuse.git
    kind: self
    check: git-head
    auto_update: fast-forward-pull
  - name: strix
    covers:
      - methodology-reference
    repo: https://github.com/usestrix/strix.git
    kind: reference
    check: git-head
    auto_update: none
  - name: securly
    covers:
      - dev-audit-ai-agent-layer
    repo: https://github.com/BghitCode/Securly.git
    kind: reference
    check: git-head
    auto_update: none
  - name: cloudflare
    covers:
      - security-audit
      - dev-audit-edge-checklist
    repo: https://github.com/cloudflare/security-audit-skill.git
    kind: reference
    check: git-head
    auto_update: none
    cli: none
  - name: sentry
    covers:
      - security-review
      - gha-security-review
      - security-model
    repo: https://github.com/getsentry/skills.git
    kind: reference
    check: git-head
    auto_update: none
    cli: none
  - name: owasp
    covers:
      - owasp-security
    repo: https://github.com/agamm/claude-code-owasp.git
    kind: reference
    check: git-head
    auto_update: none
    cli: none
  - name: masriyan
    covers:
      - 01-recon-osint
      - 02-vulnerability-scanner
      - 08-network-security
      - 09-web-security
      - 16-ai-llm-security
    repo: https://github.com/Masriyan/Claude-Code-CyberSecurity-Skill.git
    kind: reference
    check: git-head
    auto_update: none
    cli: nmap, nuclei, trivy, zap, sqlmap, tshark, suricata, snort, zeek, plus skill scripts (Python 3.10+, full plugin checkout)
  - name: trailofbits
    covers:
      - semgrep
      - codeql
      - sarif-parsing
      - differential-review
      - variant-analysis
      - semgrep-rule-creator
      - semgrep-rule-variant-creator
    repo: https://github.com/trailofbits/skills.git
    kind: reference
    check: git-head
    auto_update: none
    cli: semgrep, codeql
  - name: openai
    covers:
      - threat-model
      - security-diff-scan
      - validation
      - propose-security-hardening
      - fix-finding
    repo: https://github.com/openai/codex-security.git
    kind: reference
    check: git-head
    auto_update: none
    cli: none
  - name: clawsec
    covers:
      - soul-guardian
      - clawsec-scanner
      - openclaw-audit-watchdog
    repo: https://github.com/prompt-security/clawsec.git
    kind: reference
    check: git-head
    auto_update: none
    cli: clawsec
  - name: varlock
    covers:
      - varlock-env-management
    repo: https://github.com/dmno-dev/varlock.git
    kind: reference
    check: git-head
    auto_update: none
    cli: varlock
  - name: rea
    covers:
      - reverse-engineering
    repo: https://github.com/morluto/rea.git
    kind: reference
    check: git-head
    auto_update: none
    cli: rea-agents
  - name: squirrelscan
    covers:
      - audit-website
    repo: https://github.com/squirrelscan/skills.git
    kind: reference
    check: git-head
    auto_update: none
    cli: squirrel
