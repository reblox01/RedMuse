name: Auto tag

on:
  push:
    branches: [main]
    # Tag on any change except workflows, README, LICENSE, and assets.
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
      - "**/README.md"
      - "LICENSE"
      - "assets/**"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide next version
        id: version
        run: |
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only 4b825dc642cb6eb9a060e54bf8d69288fbee4904 "$sha")
            messages=$(git log --format=%B -n 20 "$sha")
          else
            files=$(git diff --name-only "$before" "$sha")
            messages=$(git log --format=%B "$before..$sha")
          fi
          if [ -z "$files" ]; then
            changed=false
          elif printf '%s\n' "$files" | grep -q -v -E '^(\.github/workflows/.*|(.*/)?README\.md|LICENSE|assets/.*)$'; then
            changed=true
          else
            changed=false
          fi
          if [ "$changed" = "false" ]; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "No taggable change in range, skipping."
            exit 0
          fi
          if echo "$messages" | grep -q "\[skip-release\]"; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "skip-release found, skipping."
            exit 0
          fi
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            echo "new=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=${latest#v}
          major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
          if echo "$messages" | grep -q "\[release:major\]"; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$messages" | grep -q "\[release:minor\]"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "new=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        if: steps.version.outputs.tagged == 'true'
        run: |
          new="${{ steps.version.outputs.new }}"
          git tag "$new" || echo "tag $new already exists"
          git push origin "$new" || echo "tag $new already pushed, skipping"
      - name: Create release for new tag
        if: steps.version.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="${{ steps.version.outputs.new }}"
          if gh release view "$new" >/dev/null 2>&1; then
            echo "release $new already exists, skipping"
            exit 0
          fi
          python3 - <<'EOF'
          import zipfile
          from pathlib import Path
          tag = "${{ steps.version.outputs.new }}"
          out = f"redmuse-{tag}.zip"
          include = ["skills", "docs", "templates", "tools", "scripts",
                     "examples", "README.md", "LICENSE", "CONTRIBUTING.md"]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for item in include:
                  p = Path(item)
                  if p.is_file():
                      zf.write(p, p.name)
                  elif p.is_dir():
                      for f in sorted(p.rglob("*")):
                          if f.is_file():
                              zf.write(f, f)
          print(f"built {out}")
          EOF
          gh release create "$new" \
            --title "RedMuse $new" \
            --notes "Skill pack release. Install by asking Muse to install RedMuse $new from https://github.com/reblox01/RedMuse, or download the zip below and install it with scripts/install.sh. Test targets are not in the zip; they stay in the repo for demos only." \
            redmuse-*.zip
